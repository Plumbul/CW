<nav class="navbar navbar-expand-lg sticky-top shadow-sm">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center" href="{{ url_for('index') }}">
            <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Shop" height="36" class="me-2 rounded-circle border border-danger">
            <span class="fw-bold fs-4 text-white">Shop</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item mx-1">
                    <a class="btn btn-danger text-white px-3 py-2 fw-medium" href="{{ url_for('catalog') }}">
                        Крамниця
                    </a>
                </li>
                <li class="nav-item mx-1">
                    <a class="btn btn-danger text-white px-3 py-2 fw-medium" href="{{ url_for('promotions') }}">
                        Акції
                    </a>
                </li>
                <li class="nav-item mx-1">
                    <a class="btn btn-danger text-white px-3 py-2 fw-medium" href="{{ url_for('about') }}">
                        Про нас
                    </a>
                </li>
            </ul>

            {% if session.get('role') == 1 %}
                <a href="{{ url_for('admin_main') }}" class="btn btn-warning fw-bold me-2 px-3 d-flex align-items-center" style="height: 42px;">
                    <i class="bi bi-speedometer2 me-1"></i> Адмін-панель
                </a>
            {% endif %}

            <button id="theme-toggle-header"
                    class="btn btn-outline-light me-3 d-flex align-items-center justify-content-center"
                    style="width: 42px; height: 42px; font-size: 1.2rem;">
                <i class="bi bi-moon-stars-fill" id="theme-icon-header"></i>
            </button>

            <form class="d-flex me-3" action="{{ url_for('catalog') }}" method="GET" style="max-width: 320px;">
                <input type="text" name="search" class="form-control me-2"
                       placeholder="🔍 Пошук товарів..." value="{{ request.args.get('search', '') }}">
            </form>

            <div class="d-flex align-items-center gap-2">
                {% if session.get('user_id') %}
                    <a href="{{ url_for('profile') }}" class="btn btn-outline-light px-3">
                        <i class="bi bi-person"></i> Кабінет
                    </a>
                    <a href="{{ url_for('logout') }}" class="btn btn-outline-danger px-3">
                        Вийти
                    </a>
                {% else %}
                    <a href="{{ url_for('login') }}" class="btn btn-outline-light px-3">Увійти</a>
                    <a href="{{ url_for('register') }}" class="btn btn-danger px-3">Реєстрація</a>
                {% endif %}

                <a href="{{ url_for('favorites') }}" class="position-relative text-white fs-5 px-2">
                    <i class="bi bi-heart"></i>
                    <span id="fav-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger small">0</span>
                </a>

                <a href="{{ url_for('cart') }}" class="position-relative text-white fs-5 px-2">
                    <i class="bi bi-cart3"></i>
                    <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-success small">0</span>
                </a>
            </div>
        </div>
    </div>
</nav>
