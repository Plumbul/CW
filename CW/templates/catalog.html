{% extends "layout.html" %}
{% block content %}
<div class="container mt-5">
    <h2 class="fw-bold mb-2">Крамниця</h2>
    <p class="text-muted mb-4">Оберіть категорію або перегляньте всі товари</p>

    <style>
        .category-card, .subcategory-card {
            transition: all 0.25s ease-in-out;
            border: 3px solid transparent !important; /* Резервуємо місце під контур, щоб верстка не смикалася */
        }

        /* Клас, який динамічно додається до обраної картки */
        .active-category-card {
            border-color: #dc3545 !important; /* Яскраво-червоний колір Bootstrap Danger */
            box-shadow: 0 8px 24px rgba(220, 53, 69, 0.25) !important; /* Об'ємна червонувата тінь */
            transform: translateY(-2px); /* Легке підняття картки для інтерактивності */
        }

        /* Додатковий контраст для світлої теми, якщо активовано body.light-mode */
        body.light-mode .active-category-card {
            border-color: #dc3545 !important;
            box-shadow: 0 8px 24px rgba(220, 53, 69, 0.35) !important;
            background-color: rgba(220, 53, 69, 0.02) !important; /* Легке підсвічування фону картки */
        }
    </style>

    <div id="categories-section">
        <h4 class="mb-3" id="section-title">Категорії</h4>
        <div class="row g-4 mb-4" id="main-categories-container"></div>
    </div>

    <div id="subcategories-section" class="d-none mb-4">
        <h5 class="mb-3">Підкатегорії</h5>
        <div class="row g-3" id="subcategories-container"></div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <button class="btn btn-outline-primary" onclick="toggleFilters()">
            <i class="bi bi-funnel-fill"></i> Фільтри
        </button>

        <select id="sort-select" class="form-select w-auto" onchange="applyFilters()">
            <option value="new">Новинки</option>
            <option value="price_asc">Ціна: від дешевих</option>
            <option value="price_desc">Ціна: від дорогих</option>
            <option value="name_asc">Назва А-Я</option>
        </select>
    </div>

    <div class="row g-4" id="products-container"></div>
</div>

<div class="offcanvas offcanvas-end" tabindex="-1" id="filtersOffcanvas">
    <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title fw-bold">Фільтри товарів</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body" id="filters-body">
        </div>
    <div class="p-3 border-top d-flex gap-2 bg-light">
        <button class="btn btn-secondary w-100" onclick="resetFilters()">Скинути все</button>
    </div>
</div>

<script>
// Дані
const allProducts = {{ products|tojson }};
const mainCategories = {{ main_categories|tojson }};
const allSubcategories = {{ subcategories|tojson }};

let currentCategoryId = null;
let currentSubcategoryId = null;

// Допоміжна функція для нормалізації та супер-очищення тексту від невидимих символів/байтів
function superCleanText(str) {
    if (!str) return '';
    return String(str)
        .normalize('NFC')
        .trim()
        .toLowerCase()
        .replace(/[\u00A0\u1680\u180E\u2000-\u200B\u2028\u2029\u202F\u205F\u3000\uFEFF]/g, '') // Видалення невидимих пробілів
        .replace(/\s+/g, ' ');
}

// === Головна логіка ===
function showMainCategories() {
    currentCategoryId = null;
    currentSubcategoryId = null;
    document.getElementById('subcategories-section').classList.add('d-none');
    document.getElementById('section-title').textContent = 'Категорії';

    let html = '';
    mainCategories.forEach(cat => {
        html += `
            <div class="col-md-4 col-lg-3">
                <div class="card h-100 border-0 shadow-sm text-center p-4 cursor-pointer hover-card category-card"
                     data-id="${cat.id_category}"
                     onclick="selectMainCategory(this, ${cat.id_category}, '${cat.name.replace("'", "\\'")}')">
                    <i class="bi bi-folder-fill display-1 text-danger mb-3"></i>
                    <h5>${cat.name}</h5>
                    <small class="text-muted">${cat.product_count || 0} товарів</small>
                </div>
            </div>`;
    });
    document.getElementById('main-categories-container').innerHTML = html;

    renderProducts(allProducts);
    generateDynamicFilters(allProducts);
}

function selectMainCategory(element, catId, catName) {
    currentCategoryId = catId;
    currentSubcategoryId = null;
    document.getElementById('section-title').textContent = catName;
    document.getElementById('subcategories-section').classList.remove('d-none');

    // Видаляємо виділення з усіх головних категорій за допомогою нового кастомного класу
    document.querySelectorAll('.category-card').forEach(card => {
        card.classList.remove('active-category-card');
    });
    if (element) {
        element.classList.add('active-category-card');
    }

    const subs = allSubcategories.filter(s => parseInt(s.category_id) === parseInt(catId));
    let html = '';
    subs.forEach(sub => {
        html += `
            <div class="col-md-3 col-sm-4">
                <div class="card h-100 text-center p-3 cursor-pointer hover-card border-0 shadow-sm subcategory-card"
                     data-id="${sub.id_subcategory}"
                     onclick="selectSubcategory(this, ${sub.id_subcategory}, '${sub.name.replace("'", "\\'")}')">
                    <h6>${sub.name}</h6>
                    <small class="text-muted">${sub.product_count || 0} товарів</small>
                </div>
            </div>`;
    });
    document.getElementById('subcategories-container').innerHTML = html || '<p class="text-muted">Підкатегорій немає</p>';

    const filtered = allProducts.filter(p => parseInt(p.id_category) === parseInt(catId));
    renderProducts(filtered);
    generateDynamicFilters(filtered);
}

function selectSubcategory(element, subId, subName) {
    currentSubcategoryId = subId;

    // Видаляємо виділення з усіх підкатегорій за допомогою нового кастомного класу
    document.querySelectorAll('.subcategory-card').forEach(card => {
        card.classList.remove('active-category-card');
    });
    if (element) {
        element.classList.add('active-category-card');
    }

    const filtered = allProducts.filter(p => parseInt(p.id_subcategory) === parseInt(subId));
    renderProducts(filtered);
    generateDynamicFilters(filtered);
}

// === Генерація фільтрів ===
function generateDynamicFilters(products) {
    const container = document.getElementById('filters-body');
    container.innerHTML = '<h6 class="mb-3">Характеристики</h6>';

    const attrMap = {};
    products.forEach(p => {
        if (p.attributes) {
            p.attributes.forEach(attr => {
                const displayKey = attr.attr_name.trim();
                if (!displayKey) return;

                if (!attrMap[displayKey]) attrMap[displayKey] = new Set();
                if (attr.value !== undefined && attr.value !== null) {
                    attrMap[displayKey].add(String(attr.value).trim());
                }
            });
        }
    });

    console.log("=== ОЦЕЙ ОБ'ЄКТ НАМ ПОТРІБЕН ===", attrMap);

    Object.keys(attrMap).forEach(attrName => {
        const values = [...attrMap[attrName]];
        const isNumeric = values.length > 0 && values.every(v => !isNaN(parseFloat(v)) && isFinite(v));

        if (isNumeric) {
            const nums = values.map(v => parseFloat(v)).sort((a, b) => a - b);
            const min = nums[0];
            const max = nums[nums.length - 1];

            container.innerHTML += `
                <div class="mb-4">
                    <label class="form-label fw-bold">${attrName}</label>
                    <div class="d-flex gap-2">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text">від</span>
                            <input type="number" class="form-control filter-range-min"
                                   data-attr="${attrName}"
                                   placeholder="${min}"
                                   value="${min}"
                                   onchange="applyFilters()">
                        </div>
                        <div class="input-group input-group-sm">
                            <span class="input-group-text">до</span>
                            <input type="number" class="form-control filter-range-max"
                                   data-attr="${attrName}"
                                   placeholder="${max}"
                                   value="${max}"
                                   onchange="applyFilters()">
                        </div>
                    </div>
                </div>`;
        } else {
            container.innerHTML += `<div class="mb-3"><label class="form-label fw-bold">${attrName}</label>`;

            values.sort((a, b) => a.localeCompare(b)).forEach(val => {
                const safeId = 'filter-' + btoa(unescape(encodeURIComponent(attrName + '-' + val))).replace(/=/g, '');

                container.innerHTML += `
                    <div class="form-check">
                        <input class="form-check-input filter-checkbox" type="checkbox"
                               data-attr="${attrName}" value="${val}" id="${safeId}" onchange="applyFilters()">
                        <label class="form-check-label" for="${safeId}">${val}</label>
                    </div>`;
            });
            container.innerHTML += `</div>`;
        }
    });

    if (Object.keys(attrMap).length === 0) {
        container.innerHTML += '<p class="text-muted">Характеристики для фільтрації немає.</p>';
    }
}

function applyFilters() {
    let filtered = allProducts;

    if (currentCategoryId) {
        filtered = filtered.filter(p => p.id_category && parseInt(p.id_category) === parseInt(currentCategoryId));
    }
    if (currentSubcategoryId) {
        filtered = filtered.filter(p => p.id_subcategory && parseInt(p.id_subcategory) === parseInt(currentSubcategoryId));
    }

    const checkboxGroups = {};
    document.querySelectorAll('.filter-checkbox:checked').forEach(cb => {
        const attrKey = superCleanText(cb.dataset.attr);
        if (!checkboxGroups[attrKey]) checkboxGroups[attrKey] = [];
        checkboxGroups[attrKey].push(superCleanText(cb.value));
    });

    Object.keys(checkboxGroups).forEach(cleanAttrName => {
        const allowedValues = checkboxGroups[cleanAttrName];
        filtered = filtered.filter(p =>
            p.attributes && Array.isArray(p.attributes) && p.attributes.some(a =>
                superCleanText(a.attr_name) === cleanAttrName &&
                allowedValues.includes(superCleanText(a.value))
            )
        );
    });

    const minInputs = document.querySelectorAll('.filter-range-min');
    minInputs.forEach(minInput => {
        const originalAttrName = minInput.dataset.attr;
        const cleanAttrName = superCleanText(originalAttrName);

        const maxInput = document.querySelector(`.filter-range-max[data-attr="${originalAttrName}"]`);

        const minVal = minInput.value !== '' ? parseFloat(minInput.value) : -Infinity;
        const maxVal = (maxInput && maxInput.value !== '') ? parseFloat(maxInput.value) : Infinity;

        filtered = filtered.filter(p => {
            if (!p.attributes || !Array.isArray(p.attributes)) return false;

            const hasAttribute = p.attributes.some(a => superCleanText(a.attr_name) === cleanAttrName);
            if (!hasAttribute) return true;

            return p.attributes.some(a => {
                if (superCleanText(a.attr_name) === cleanAttrName) {
                    const num = parseFloat(a.value);
                    return !isNaN(num) && num >= minVal && num <= maxVal;
                }
                return false;
            });
        });
    });

    const sortSelect = document.getElementById('sort-select');
    const sortType = sortSelect ? sortSelect.value : 'new';

    filtered.sort((a, b) => {
        const priceA = parseFloat(a.base_price) || 0;
        const priceB = parseFloat(b.base_price) || 0;
        if (sortType === 'price_asc') return priceA - priceB;
        if (sortType === 'price_desc') return priceB - priceA;
        if (sortType === 'name_asc') return (a.name || '').localeCompare(b.name || '');
        return parseInt(b.id_product || 0) - parseInt(a.id_product || 0);
    });

    renderProducts(filtered);
}

function resetFilters() {
    currentCategoryId = null;
    currentSubcategoryId = null;

    document.querySelectorAll('.filter-checkbox').forEach(cb => cb.checked = false);

    const sortSelect = document.getElementById('sort-select');
    if (sortSelect) sortSelect.value = 'new';

    const offcanvasEl = document.getElementById('filtersOffcanvas');
    if (offcanvasEl && typeof bootstrap !== 'undefined') {
        const offcanvas = bootstrap.Offcanvas.getInstance(offcanvasEl);
        if (offcanvas) offcanvas.hide();
    }

    showMainCategories();
}

function toggleFilters() {
    const offcanvasEl = document.getElementById('filtersOffcanvas');
    if (offcanvasEl && typeof bootstrap !== 'undefined') {
        const bsOffcanvas = new bootstrap.Offcanvas(offcanvasEl);
        bsOffcanvas.toggle();
    }
}

function renderProducts(productsList) {
    const container = document.getElementById('products-container');
    container.innerHTML = '';

    if (productsList.length === 0) {
        container.innerHTML = `<div class="col-12 text-center py-5"><p class="text-muted">Товарів не знайдено.</p></div>`;
        return;
    }

    productsList.forEach(product => {
        const imgSrc = (product.images && product.images.length > 0)
            ? `/static/images/products/${product.images[0].filename}`
            : 'https://via.placeholder.com/300x200/1a1a1a/666?text=Немає+фото';

        let ratingHTML = '';
        if (product.avg_rating) {
            const rating = Math.round(parseFloat(product.avg_rating));
            ratingHTML = `
                <div class="mb-2">
                    <span class="text-warning fs-5">${'★'.repeat(rating)}${'☆'.repeat(5 - rating)}</span>
                    <small class="text-muted ms-1">(${product.review_count || 0})</small>
                </div>`;
        }

        const html = `
            <div class="col-xxl-3 col-xl-4 col-lg-4 col-md-6 col-sm-6 mb-4">
                <div class="card h-100 shadow-sm border-0 position-relative">

                    <button class="btn btn-light position-absolute top-2 end-2 rounded-circle shadow-sm fav-btn"
                            style="width: 45px; height: 45px; padding: 0; z-index: 10;"
                            data-id="${product.id_product}"
                            onclick="toggleFavorite('${product.id_product}',
                                                   '${product.name.replace(/'/g, "\\'")}',
                                                   ${product.base_price},
                                                   '${product.images && product.images.length > 0 ? product.images[0].filename : ""}')">
                        <i class="bi bi-heart text-danger fs-5"></i>
                    </button>

                    <img src="${imgSrc}"
                         class="card-img-top"
                         style="height: 200px; object-fit: cover;"
                         alt="${product.name}"
                         onerror="this.src='https://via.placeholder.com/300x200/1a1a1a/666?text=Немає+фото';">

                    <div class="card-body d-flex flex-column p-3">
                        <h5 class="card-title mb-3">
                            <a href="/product/${product.id_product}"
                               class="text-decoration-none fw-bold">${product.name}</a>
                        </h5>

                        ${ratingHTML}

                        <h4 class="text-primary fw-bold mt-auto mb-3">
                            ${parseFloat(product.base_price).toFixed(0)} грн
                        </h4>

                        <button class="btn btn-primary"
                                onclick="addToCart('${product.id_product}', '${product.name.replace(/'/g, "\\'")}', ${product.base_price},
                                                  '${product.images && product.images.length > 0 ? product.images[0].filename : ""}')">
                            До кошика
                        </button>
                    </div>
                </div>
            </div>`;

        container.innerHTML += html;
    });
}
document.addEventListener('DOMContentLoaded', showMainCategories);
</script>
{% endblock %}
