{% extends "layout.html" %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">
            <i class="bi bi-heart-fill text-danger me-2"></i>Улюблені товари
        </h2>
        <span id="fav-total" class="text-muted fs-5"></span>
    </div>

    <div id="favorites-list" class="row g-4"></div>

    <div id="empty-favorites" class="text-center py-5" style="display: none;">
        <i class="bi bi-heart" style="font-size: 6rem; opacity: 0.1;"></i>
        <h3 class="mt-4 text-muted">Список улюблених порожній</h3>
        <p class="text-muted">Натисни ❤️ на товарі, щоб додати його сюди</p>
        <a href="{{ url_for('catalog') }}" class="btn btn-success btn-lg mt-3">Перейти до каталогу</a>
    </div>
</div>

<script>
    function renderFavorites() {
        const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
        console.log("📋 Товари в улюблених:", favorites);

        const container = document.getElementById('favorites-list');
        const empty = document.getElementById('empty-favorites');
        const totalEl = document.getElementById('fav-total');

        totalEl.textContent = `${favorites.length} товар${favorites.length === 1 ? '' : 'ів'}`;

        if (favorites.length === 0) {
            container.style.display = 'none';
            empty.style.display = 'block';
            return;
        }

        container.style.display = 'flex';
        empty.style.display = 'none';
        container.innerHTML = '';

        favorites.forEach(item => {
            // Реальне фото
            let imgSrc = 'https://via.placeholder.com/300x220/1a1a1a/666?text=Немає+фото';

            if (item.image) {
                imgSrc = `/static/images/products/${item.image}`;
            }

            const html = `
                <div class="col-md-6 col-lg-4 col-xl-3">
                    <div class="card h-100 shadow-sm">
                        <a href="/product/${item.id}">
                            <img src="${imgSrc}"
                                 class="card-img-top"
                                 style="height: 220px; object-fit: cover;"
                                 alt="${item.name}"
                                 onerror="this.src='https://via.placeholder.com/300x220/1a1a1a/666?text=Немає+фото';">
                        </a>
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">
                                <a href="/product/${item.id}" class="text-decoration-none text-dark">
                                    ${item.name}
                                </a>
                            </h5>
                            <p class="text-success fw-bold fs-5 mb-3">${parseFloat(item.price || 0).toFixed(0)} грн</p>

                            <div class="mt-auto">
                                <button class="btn btn-success w-100 mb-2"
                                        onclick="addToCart('${item.id}', '${(item.name || '').replace(/'/g, "\\'")}', ${item.price || 0}, '${item.image || ''}')">
                                    🛒 До кошика
                                </button>
                                <button class="btn btn-outline-danger w-100"
                                        onclick="toggleFavorite('${item.id}'); renderFavorites();">
                                    ❤️ Видалити
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;

            container.insertAdjacentHTML('beforeend', html);
        });
    }

    document.addEventListener('DOMContentLoaded', renderFavorites);
</script>
{% endblock %}
